const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT)));
}
async function go(pass,quiet){
  let html;try{html=await unlock(pass)}catch(e){if(!quiet)document.getElementById("lockErr").textContent="That passcode isn't right.";return false}
  try{localStorage.setItem("kpTeamPass",pass)}catch(e){}
  document.getElementById("lock").remove();document.body.insertAdjacentHTML("beforeend",html);
  const r=document.createElement("script");r.src="report.js?v=20261117l";r.onload=()=>{const s=document.createElement("script");s.src="app.js?v=20261117l";document.body.appendChild(s)};document.body.appendChild(r);return true;
}
let saved=null;try{saved=localStorage.getItem("kpTeamPass")}catch(e){}
(saved?go(saved,true):Promise.resolve(false)).then(ok=>{if(!ok)document.getElementById("lockPass").focus()});
document.getElementById("lockForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("lockBtn");b.disabled=true;document.getElementById("lockErr").textContent="Unlocking…";
  const ok=await go(document.getElementById("lockPass").value,false);if(!ok)b.disabled=false};
})();
